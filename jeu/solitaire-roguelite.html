  if (!AU.ctx) { try { AU.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AU.ctx = null; } }

function tone(f, d, type = 'square', v = .04, slide = 0, delay = 0) {
  const c = AU.ctx; if (!c || !AU.on) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .02);
}

  const c = AU.ctx; if (!c || !AU.on) return;
  const t = c.currentTime + delay, len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}

const fxc = $('#fx'), fx = fxc.getContext('2d');
let parts = [], shakeAmt = 0, fxRun = false;
function fxSize() { const d = Math.min(2, devicePixelRatio || 1); fxc.width = innerWidth * d; fxc.height = innerHeight * d; fx.setTransform(d, 0, 0, d, 0, 0); }
const PCOL = ['#ff2a1a', '#ffd400', '#000080', '#ffffff', '#2fb12f', '#1084d0', '#000000'];
function explode(x, y, p, word) {
  const n = Math.min(160, Math.round((RM ? 4 : 14) + p * (RM ? 3 : 16)));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rnd(80, 260 + p * 70);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: rnd(.5, 1.1), max: 1.1, s: rnd(3, 6 + p), c: pick(PCOL), rot: rnd(0, 6) });
  }
  if (word) popAt(x, y, word, 'boom', 0);
  shake(p * 2.2);
  sfx.boom(p);
  startFx();
}
function shake(a) { if (RM) return; shakeAmt = Math.min(26, shakeAmt + a); startFx(); }
function startFx() { if (!fxRun) { fxRun = true; requestAnimationFrame(fxLoop); } }
let fxLast = 0;
function fxLoop(t) {
  const dt = fxLast ? Math.min(.05, (t - fxLast) / 1000) : .016; fxLast = t;
  fx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts) {
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.rot += dt * 8;
    fx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.6)); fx.fillStyle = p.c;
    fx.save(); fx.translate(p.x, p.y); fx.rotate(p.rot); fx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); fx.restore();
  }
  fx.globalAlpha = 1;
  parts = parts.filter(p => p.life > 0);
  if (shakeAmt > .3) {
    win.style.transform = `translate(${rnd(-shakeAmt, shakeAmt)}px, ${rnd(-shakeAmt, shakeAmt)}px) rotate(${rnd(-shakeAmt, shakeAmt) * .05}deg)`;
    shakeAmt *= Math.pow(.02, dt);
  } else { shakeAmt = 0; win.style.transform = ''; }
  if (parts.length || shakeAmt) requestAnimationFrame(fxLoop); else { fxRun = false; fxLast = 0; fx.clearRect(0, 0, innerWidth, innerHeight); }
}
let popT = 0;
function popAt(x, y, text, kind, stagger = 1) {
  const now = performance.now(), delay = stagger ? Math.max(0, popT - now) : 0;

    pops.appendChild(el); setTimeout(() => el.remove(), 1400);

}

function callRelic(src, idx, type, extra, depth) {

  if (inst.id === 'raccourci') { if (depth < 4) callRelic(src, idx + 1, type, extra, depth + 1); return; }
  const h = RELICS[inst.id][type]; if (!h) return;

}
function ctxFor(src, inst, extra) {
  const r = S.round, cb = r && r.combo;
  return Object.assign({}, extra, {
    inst, run: S.run, r, src,
    chips: n => { cb.chips = Math.max(0, cb.chips + n); fxRelic(src, (n >= 0 ? '+' : '') + n, n >= 0 ? 'chips' : 'bad'); },
    mult: n => { cb.mult += n; fxRelic(src, '+' + dec(n) + ' Mult', 'mult'); },
    xmult: n => { cb.mult *= n; fxRelic(src, '×' + dec(n) + ' Mult', 'mult'); shake(2); },
    money: n => { S.run.money += n; if (extra.lines) extra.lines.push([RELICS[inst.id].name, n]); fxRelic(src, (n >= 0 ? '+' : '−') + Math.abs(n) + ' $', n >= 0 ? 'money' : 'bad'); },
    say: t => fxRelic(src, t, 'info'),

    boom: (p, w) => { const el = $('#inv').children[src]; const rc = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0 }; explode(rc.left + rc.width / 2, rc.top + 10, p, w); }
  });
}

const pile = n => { const p = S.round.piles; return n === 'stock' ? p.stock : n === 'waste' ? p.waste : n[0] === 'f' ? p.f[+n[1]] : p.t[+n[1]]; };
const top = a => a[a.length - 1];
function canFound(c, fi) { const p = S.round.piles.f[fi], t = top(p); return t ? (t.suit === c.suit && t.rank === c.rank - 1) : c.rank === 1; }
function canTab(c, ti) { const t = top(S.round.piles.t[ti]); return t ? (t.up && isRed(t) !== isRed(c) && t.rank === c.rank + 1) : c.rank === 13; }

function startRound() {
  const run = S.run, boss = run.blind === 2 ? run.bossId : null;
  const cards = shuffle(run.deck.map(c => ({ ...c, up: false, scored: false })));
  const t = [[], [], [], [], [], [], []];
  for (let i = 0; i < 7; i++) for (let j = i; j < 7; j++) t[j].push(cards.pop());
  t.forEach(col => { col[col.length - 1].up = true; });
  S.round = { piles: { stock: cards, waste: [], f: [[], [], [], []], t }, score: 0, combo: { chips: 0, mult: 1, n: 0 }, target: targetFor(run.ante, run.blind),
    recycles: boss === 'vegas' ? 0 : 3, undos: 3, draw: 3, hist: [], ie: [], defrag: [true, false, false, false, false, false, false], time: 0, idle: 0, boss, won: false, peek: 0, turbo: run.turbo, clipT: 0 };
  run.turbo = false;
  S.phase = 'play';
  wrap.querySelectorAll('.clip').forEach(c => c.remove());
  hooks('roundStart');
  status(boss ? `Boss : ${BOSSES[boss].name}. ${BOSSES[boss].desc}` : 'Distribution terminée. Bonne chance.');
  render(); save();
}
function snapshot() { const r = S.round; return JSON.stringify({ piles: r.piles, combo: r.combo, score: r.score, recycles: r.recycles, ie: r.ie, defrag: r.defrag }); }
function pushHist() { const h = S.round.hist; h.push(snapshot()); if (h.length > 25) h.shift(); }
function undo() {
  const r = S.round; if (!canAct()) return;
  if (r.undos <= 0 || !r.hist.length) { sfx.ding(); status('Impossible d\'annuler.'); return; }
  Object.assign(r, JSON.parse(r.hist.pop())); r.undos--;
  hooks('undo'); sfx.place(); render(); save();
}

function lvl(k) { return S.run.lv[k] || 1; }
function baseFound(card, dst) {
  const cb = S.round.combo, L = lvl('found');
  let ch = chipVal(card) + 8 * (L - 1); if (card.ench === 'bonus') ch += 30;
  cb.chips += ch; cb.mult += L;
  popPile(dst, '+' + ch, 'chips'); popPile(dst, '+' + L + ' Mult', 'mult');
  if (card.ench === 'holo') { cb.mult += 10; popPile(dst, '+10 Mult', 'mult'); }
  if (card.ench === 'verre') {
    cb.mult *= 2; popPile(dst, '×2 Mult', 'mult');
    if (Math.random() < .25 && S.run.deck.length > 32) { card.broken = true; popPile(dst, 'CRAC', 'bad'); sfx.crack(); shake(3); }
  }
  if (card.ench === 'or') { S.run.money += 2; popPile(dst, '+2 $', 'money'); }
  if (card.ench === 'dynamite') {
    cb.chips += 40; cb.mult *= 1.5; card.broken = S.run.deck.length > 32;
    const p = boardPt(pilePos(dst)); explode(p.x, p.y + 20, 7, 'BADABOUM');
  } else { const p = boardPt(pilePos(dst)); explode(p.x, p.y + 20, .4); }
}
function doMove(src, idx, dst) {
  pushHist();
  const r = S.round, sp = pile(src), dp = pile(dst), cards = sp.splice(idx), card = cards[0];
  dp.push(...cards);
  const cb = r.combo; let useful = false;
  if (dst[0] === 'f') {
    if (!card.scored) { card.scored = true; baseFound(card, dst); hooks('found', { card }); useful = true; }
  } else if (src === 'waste') {
    const L = lvl('waste'); cb.chips += 5 * L; cb.mult += L - 1;
    popPile(dst, '+' + 5 * L, 'chips'); if (L > 1) popPile(dst, '+' + (L - 1) + ' Mult', 'mult');
    hooks('waste', { card }); useful = true;
  } else if (src[0] === 'f') { cb.chips = Math.max(0, cb.chips - 15); popPile(dst, '−15', 'bad'); }
  if (src[0] === 't' && sp.length && !top(sp).up) {
    top(sp).up = true; const L = lvl('reveal'); cb.chips += 5 * L; cb.mult += L - 1;
    popPile(src, '+' + 5 * L, 'chips'); if (L > 1) popPile(src, '+' + (L - 1) + ' Mult', 'mult');
    hooks('reveal', { card: top(sp) }); useful = true;
  }
  if (useful) cb.n++;
  afterMove();
}
function afterMove() {
  const r = S.round;
  for (const e of r.ie) if (--e.n === 0) { r.combo.chips += 60; fxRelic(e.src, '+60 (chargé)', 'chips'); }
  r.ie = r.ie.filter(e => e.n > 0);
  r.piles.t.forEach((col, i) => { if (!r.defrag[i] && col.length && col.every(c => c.up)) { r.defrag[i] = true; hooks('defrag'); } });
  sfx.place();
  const inF = r.piles.f.reduce((a, p) => a + p.length, 0);
  if (inF === S.run.deck.length && !r.won) { r.total = true; cash(); if (!r.won) { r.won = true; setTimeout(roundWon, 700); } }
  render(); save();
}
function smartMove(src, idx) {
  const p = pile(src), c = p[idx];
  if (src !== 'stock' && src[0] !== 'f' && idx === p.length - 1) for (let fi = 0; fi < 4; fi++) if (canFound(c, fi)) return doMove(src, idx, 'f' + fi);
  const opts = [];
  for (let ti = 0; ti < 7; ti++) if ('t' + ti !== src && canTab(c, ti)) opts.push(ti);
  const non = opts.filter(ti => S.round.piles.t[ti].length);
  const emp = opts.filter(ti => !S.round.piles.t[ti].length && !(src[0] === 't' && idx === 0));
  const ti = non.length ? non[0] : emp[0];
  if (ti !== undefined) return doMove(src, idx, 't' + ti);
  sfx.ding();
  const el = board.querySelector(`.card[data-p="${src}"][data-i="${idx}"]`);
  if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
}
function drawStock() {
  const r = S.round; if (!canAct()) return;
  const st = r.piles.stock, w = r.piles.waste;
  if (!st.length && !w.length) { sfx.ding(); return; }
  if (!st.length && r.recycles <= 0) { sfx.ding(); status('Plus de donnes. Encaissez puis terminez la manche.'); return; }
  if (r.boss === 'lecteur' && !r.reading) {
    r.loading = true; sfx.disk(); render();
    setTimeout(() => { r.loading = false; r.reading = true; drawStock(); r.reading = false; render(); }, 1500);
    return;
  }
  cash(); if (r.won) return;
  pushHist();
  if (st.length) { for (let k = 0; k < r.draw && st.length; k++) { const c = st.pop(); c.up = true; w.push(c); } hooks('draw'); }
  else { r.recycles--; while (w.length) { const c = w.pop(); c.up = false; st.push(c); } hooks('recycle'); status('La pioche est recyclée.'); }
  afterMove();
}
function cash() {
  const r = S.round, cb = r.combo;
  if (!cb.n && !cb.chips) return 0;
  const ex = {}; hooks('cash', ex);
  if (r.turbo && !ex.cancel) { cb.mult *= 2; const p = $('#hMult').getBoundingClientRect(); popAt(p.left + p.width / 2, p.top, '×2 TURBO', 'mult'); }
  if (ex.cancel) { r.combo = { chips: 0, mult: 1, n: 0 }; render(); return 0; }
  const gain = Math.floor(cb.chips * cb.mult);
  r.score += gain; S.run.totalScore += gain;
  r.combo = { chips: 0, mult: 1, n: 0 };
  const rc = $('#hCombo').getBoundingClientRect();
  popAt(rc.left + rc.width / 2, rc.top + 10, '+' + fmt(gain), 'big', 0);
  const pw = Math.log10(gain + 1);
  explode(rc.left + rc.width / 2, rc.top + rc.height / 2, pw, gain >= 1000 ? pick(['KABOOM', 'BADABOUM', 'MÉGA', 'WOUAH']) : gain >= 200 ? pick(['BOUM', 'PAF', 'BAM']) : null);
  sfx.cash();
  if (r.score >= r.target && !r.won) { r.won = true; setTimeout(roundWon, 800); }
  render(); save();
  return gain;
}
function autoFound() {
  const r = S.round; let moved = true, n = 0;
  while (moved && n < 60) {
    moved = false;
    for (const src of ['waste', 't0', 't1', 't2', 't3', 't4', 't5', 't6']) {
      const p = pile(src), c = top(p); if (!c || !c.up) continue;
      for (let fi = 0; fi < 4; fi++) if (canFound(c, fi)) { doMove(src, p.length - 1, 'f' + fi); moved = true; n++; break; }
      if (r.won) return;
    }
  }
  if (!n) status('Aide (F1) : rien à envoyer en fondation. Clippy est déçu.');
}
function enhanceRandom(n, e) {
  const cand = shuffle(S.run.deck.filter(c => !c.ench)).slice(0, n);
  cand.forEach(c => { c.ench = e; if (S.round) for (const p of allPiles()) for (const rc of p) if (rc.id === c.id) rc.ench = e; });
  const msg = cand.length ? `${cand.map(cname).join(', ')} : ${ENCH[e].name}.` : 'Aucune carte à améliorer.';
  status(msg); return msg;
}
function allPiles() { const p = S.round.piles; return [p.stock, p.waste, ...p.f, ...p.t]; }
function levelUp(k) { S.run.lv[k] = lvl(k) + 1; const m = `${LV[k]} : niveau ${S.run.lv[k]}.`; status(m); shake(3); return m; }
function winUpdate() {
  const rel = S.run.relics; if (!rel.length) { status('Windows Update : rien à mettre à jour.'); return; }
  const i = Math.floor(Math.random() * rel.length), owned = new Set(rel.map(r => r.id));
  const pool = Object.keys(RELICS).filter(id => !owned.has(id));
  const old = RELICS[rel[i].id].name; rel[i] = { id: pick(pool) };
  const el = document.createElement('div'); el.id = 'restart';
  el.innerHTML = '<div>Veuillez patienter pendant que Windows redémarre…<br><br>' + old + ' → ' + RELICS[rel[i].id].name + '</div>';
  document.body.appendChild(el); setTimeout(() => { el.remove(); render(); }, 1600);
}
const canAct = () => S.phase === 'play' && S.round && !S.round.won && !S.round.loading && modal.hidden;

function roundWon() {
  if (S.phase !== 'play') return;
  wrap.querySelectorAll('.clip').forEach(c => c.remove());
  const run = S.run, r = S.round, lines = [];
  const interest = Math.min(5, Math.floor(Math.max(0, run.money) / 5));
  const b = BLINDS[run.blind];
  lines.push([`${run.blind === 2 ? BOSSES[r.boss].name : b.name} battue`, b.pay]); run.money += b.pay;
  if (r.recycles > 0) { lines.push([`Donnes restantes (${r.recycles})`, r.recycles]); run.money += r.recycles; }
  if (interest) { lines.push(['Intérêts (1 $ par tranche de 5 $)', interest]); run.money += interest; }
  if (r.total) { lines.push(['Victoire totale !', 5]); run.money += 5; }
  hooks('roundWin', { lines });
  run.relics = run.relics.filter(x => !x.dead);
  const broken = new Set(); for (const p of allPiles()) for (const c of p) if (c.broken) broken.add(c.id);
  run.deck = run.deck.filter(c => !broken.has(c.id));
  if (broken.size) lines.push([`${broken.size} carte(s) détruite(s)`, 0]);
  run.rounds++;
  let evicted = false;
  if (run.blind === 2) {
    const rent = rentFor(run.ante);
    if (run.money >= rent) { run.money -= rent; lines.push(['Loyer du Propriétaire', -rent]); }
    else { lines.push(['Loyer du Propriétaire : impayé', -rent]); evicted = true; }
  }
  S.lines = lines; S.phase = evicted ? 'evicted' : 'reward'; save();
  sfx.tada(); explode(innerWidth / 2, innerHeight * .4, 6, 'GAGNÉ');
  cascade(() => evicted ? showBSOD('loyer') : showRewards());
}
function endRoundAsk() {

  const r = S.round, pot = r.score + Math.floor(r.combo.chips * r.combo.mult);
  dialog({ title: 'Terminer la manche', body: `<p>Votre combo sera encaissé. Score potentiel : <b>${fmt(pot)}</b> sur <b>${fmt(r.target)}</b>.</p><p>${pot >= r.target ? 'Ça passe.' : 'Ça ne passe pas. L\'écran bleu vous attend.'}</p>`,

}

// Cascade de victoire façon Windows 95
function cascade(done) {
  const r = S.round, L = lay; if (!L) return done();
  const cv = document.createElement('canvas'); cv.id = 'casc';
  const d = Math.min(2, devicePixelRatio || 1); cv.width = L.bw * d; cv.height = L.bh * d;
  cv.style.width = L.bw + 'px'; cv.style.height = L.bh + 'px'; board.appendChild(cv);
  const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
  const seq = []; const fs = r.piles.f.map(p => p.slice());
  for (let k = 0; k < 52; k++) for (let fi = 0; fi < 4; fi++) { const c = fs[fi].pop(); if (c) seq.push({ c, fi }); }
  let live = [], t0 = performance.now(), lastLaunch = 0, ended = false, i = 0;
  const finish = () => { if (ended) return; ended = true; cv.remove(); done(); };
  cv.addEventListener('pointerdown', finish);
  if (!seq.length || RM) { setTimeout(finish, RM ? 900 : 600); return; }
  const k = L.cw / 50;
  function step(t) {
    if (ended) return;
    if (i < seq.length && t - lastLaunch > 260) {
      const s = seq[i++]; lastLaunch = t;
      live.push({ c: s.c, x: L.x(3 + s.fi), y: L.y0, vx: rnd(2, 6) * (Math.random() < .5 ? -1 : 1) * k, vy: rnd(-6, -1) * k });
    }
    for (const p of live) {
      p.vy += .45 * k; p.x += p.vx; p.y += p.vy;
      if (p.y + L.ch > L.bh) { p.y = L.bh - L.ch; p.vy *= -.78; }
      drawCardC(g, p.c, p.x, p.y, L.cw, L.ch);
    }
    live = live.filter(p => p.x > -L.cw && p.x < L.bw);
    if (t - t0 > 5500 || (i >= seq.length && !live.length)) return finish();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function drawCardC(g, c, x, y, w, h) {
  g.fillStyle = c.ench === 'or' ? '#f4c430' : c.ench === 'verre' ? '#bfe6ff' : '#fff'; g.fillRect(x, y, w, h);
  g.strokeStyle = '#000'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  g.fillStyle = isRed(c) ? '#d00000' : '#000'; g.textAlign = 'left';
  g.font = `bold ${Math.round(w * .3)}px "Times New Roman", serif`;
  g.fillText(RANKS[c.rank], x + w * .07, y + w * .3); g.fillText(SUITS[c.suit], x + w * .07, y + w * .6);
  g.textAlign = 'center'; g.font = `${Math.round(w * .55)}px "Times New Roman", serif`; g.fillText(SUITS[c.suit], x + w / 2, y + h * .82);
}

function computeLayout() {
  const bw = board.clientWidth, bh = board.clientHeight;
  const gap = Math.max(3, Math.round(bw * .012));
  let cw = Math.floor((bw - gap * 8) / 7); cw = Math.max(20, Math.min(cw, Math.floor(bh / 5.2)));
  const ch = Math.round(cw * 1.4), total = 7 * cw + 6 * gap, x0 = Math.round((bw - total) / 2);
  return { bw, bh, gap, cw, ch, y0: gap, ty: gap * 2 + ch + Math.round(ch * .06), x0, x: i => x0 + i * (cw + gap) };
}
function colOffsets(col) {
  const L = lay, down = L.ch * .1, up = L.ch * .27, offs = [0];
  for (let k = 1; k < col.length; k++) offs.push(offs[k - 1] + (col[k - 1].up ? up : down));
  const last = offs[offs.length - 1] || 0, avail = L.bh - L.ty - L.ch - L.gap;
  if (last > avail && last > 0) { const s = Math.max(0, avail) / last; for (let k = 0; k < offs.length; k++) offs[k] *= s; }
  return offs;
}

  if (name === 'stock') return { x: L.x(0) + L.cw / 2, y: L.y0 };
  if (name === 'waste') return { x: L.x(1) + L.cw / 2, y: L.y0 };
  if (name[0] === 'f') return { x: L.x(3 + +name[1]) + L.cw / 2, y: L.y0 };
  const i = +name[1], offs = colOffsets(S.round.piles.t[i]);
  return { x: L.x(i) + L.cw / 2, y: L.ty + (offs.length ? offs[offs.length - 1] : 0) };
}

  if (r && r.boss === 'sablier') { const left = Math.max(0, 180 - r.time); sub = `Reste ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; }
  $('#hSub').textContent = sub;
  $('#hTarget').textContent = fmt(r ? r.target : targetFor(run.ante, run.blind));
  const score = r ? r.score : 0;
  $('#hScore').textContent = has('y2k') ? '19' + String(Math.floor(score) % 100).padStart(2, '0') : fmt(score);
  const cb = r ? r.combo : { chips: 0, mult: 1, n: 0 };
  $('#hChips').textContent = fmt(cb.chips); $('#hMult').textContent = dec(cb.mult);
  const pot = Math.floor(cb.chips * cb.mult);
  $('#hPot').textContent = '= ' + fmt(pot);
  const ready = r && !r.won && cb.n > 0 && r.score + pot >= r.target;
  $('#bCash').classList.toggle('ready', !!ready);
  $('#bCash').disabled = !(r && S.phase === 'play' && !r.won && (cb.n > 0 || cb.chips > 0));
  $('#hCombo').classList.toggle('fire', !!(r && (ready || cb.mult >= 15)));
  $('#hMoney').textContent = run.money;
  $('#hRec').textContent = r ? r.recycles : 3;
  $('#hRent').textContent = rentFor(run.ante) + ' $';
  $('#bUndo').textContent = `Annuler ${r ? r.undos : 3}`;
  $('#bUndo').disabled = !(r && S.phase === 'play' && r.undos > 0 && r.hist.length);
  $('#bEnd').disabled = !(r && S.phase === 'play' && !r.won);
  const t = r ? r.time : 0; $('#time').textContent = `Temps ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  renderInv();
}
function render() { renderHud(); renderBoard(); }

// ================= entrées =================
board.addEventListener('pointerdown', e => {
  ac(); if (S.round) S.round.idle = 0;
  if (!canAct()) return;
  const el = e.target.closest('[data-p]'); if (!el) return;
  const p = el.dataset.p, i = +el.dataset.i;
  if (p === 'stock') { drawStock(); return; }
  const pl = pile(p); if (i < 0 || !pl[i] || !pl[i].up) return;
  if ((p === 'waste' || p[0] === 'f') && i !== pl.length - 1) return;
  const els = [...board.querySelectorAll(`.card[data-p="${p}"]`)].filter(c => +c.dataset.i >= i);
  drag = { p, i, x0: e.clientX, y0: e.clientY, els, moved: false };
  try { board.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
board.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) > 7) { drag.moved = true; drag.els.forEach(c => c.classList.add('dragging')); }
  if (drag.moved) drag.els.forEach(c => { c.style.transform = `translate(${dx}px, ${dy}px)`; });
});
function endDrag(e) {
  if (!drag) return; const d = drag; drag = null;
  if (!d.moved) { smartMove(d.p, d.i); return; }
  const rc = board.getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top, L = lay;
  const col = Math.max(0, Math.min(6, Math.floor((x - L.x0 + L.gap / 2) / (L.cw + L.gap))));
  let dst = null;
  if (y < L.ty - L.gap) { if (col >= 3) dst = 'f' + (col - 3); } else dst = 't' + col;
  const cards = pile(d.p).slice(d.i);
  if (dst && dst !== d.p && (dst[0] === 'f' ? cards.length === 1 && canFound(cards[0], +dst[1]) : canTab(cards[0], +dst[1]))) doMove(d.p, d.i, dst);
  else { if (dst !== d.p) sfx.ding(); render(); }
}
board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', () => { if (drag) { drag = null; render(); } });
$('#bCash').addEventListener('click', () => { ac(); if (canAct()) cash(); });
$('#bUndo').addEventListener('click', () => { ac(); undo(); });
$('#bEnd').addEventListener('click', () => { ac(); endRoundAsk(); });
$('#mGame').addEventListener('click', () => { ac(); startMenu(); });
$('#bStart').addEventListener('click', () => { ac(); startMenu(); });
$('#mDeck').addEventListener('click', () => { ac(); deckDialog(); });
$('#mHelp').addEventListener('click', () => { ac(); helpDialog(false); });
addEventListener('keydown', e => {
  if (!canAct()) return;
  if (e.key === ' ' || e.key === 'd') { e.preventDefault(); drawStock(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'Enter') cash();
});
addEventListener('resize', () => { fxSize(); if (S) render(); });
new ResizeObserver(() => { if (S && !drag) renderBoard(); }).observe(wrap);

// horloge : temps de manche, inactivité, boss
setInterval(() => {
  const n = new Date(); $('#clock').textContent = `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
  const r = S && S.round; if (!r || S.phase !== 'play' || r.won) return;
  r.time++; r.idle++;
  if (r.idle > 5 && r.idle <= 15) { hooks('idle'); }
  if (r.boss === 'sablier' && r.time >= 180) { cash(); if (!r.won) lose(); return; }
  if (r.boss === 'clippy' && !r.bubble && r.time % 9 === 0) clippyBubble();
  renderHud();
}, 1000);
function clippyBubble() {
  const r = S.round; r.bubble = true;
  const d = document.createElement('div'); d.className = 'clip';
  d.style.top = rnd(15, 60) + '%';
  d.innerHTML = `<svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M12 6v26a6 6 0 0 0 12 0V10a4 4 0 0 0-8 0v20" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/><circle cx="13" cy="15" r="3" fill="#fff" stroke="#000"/><circle cx="23" cy="15" r="3" fill="#fff" stroke="#000"/><circle cx="13.5" cy="15.5" r="1.2"/><circle cx="23.5" cy="15.5" r="1.2"/></svg><div><p>${pick(CLIPPY)}</p><div class="btns"><button class="btn sm">Oui</button><button class="btn sm">Non</button></div></div>`;
  d.querySelectorAll('button').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); d.remove(); r.bubble = false; if (b.textContent === 'Oui') status('Clippy : « Conseil : posez les cartes au bon endroit. »'); }));
  d.addEventListener('pointerdown', ev => ev.stopPropagation());
  wrap.appendChild(d);
}

// ================= sauvegarde =================
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ run: S.run, phase: S.phase, shop: S.shop, lines: S.lines, pick: S.pick, round: S.round ? { ...S.round, hist: [], loading: false, bubble: false } : null })); } catch (e) {}
}
function load() { try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && o.run) return o; } catch (e) {} return null; }

function boot(data) {
  fxSize();
  try { AU.on = !localStorage.getItem(KEY + '.mute'); } catch (e) {}
  const saved = (data && data.state) || load();
  if (saved) {
    S = saved; if (S.round) { S.round.hist = S.round.hist || []; S.round.loading = false; S.round.bubble = false; }
    render();
    if (S.phase === 'play') status('Partie restaurée.');
    else if (S.phase === 'reward') showRewards();
    else if (S.phase === 'pick') showPick();
    else if (S.phase === 'shop') showShop();
    else if (S.phase === 'dead' || S.phase === 'evicted') showBSOD(S.phase === 'evicted' ? 'loyer' : 'score');
    else showIntro();
  } else { newRun(); render(); helpDialog(true); }
  window.claude?.hot?.snapshot?.(() => ({ state: S }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

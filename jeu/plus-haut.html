<title>Plus Haut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: une colonne au format téléphone, une barre d'onglets fine au-dessus d'un ciel en canvas plein cadre.
   Thème unique (le ciel) par choix : toutes les couleurs sont explicites. */
:root {
  --sky: #9fd6f0;
  --sky-low: #e4f4fb;
  --ink: #1d2a5b;
  --ink-soft: #55608a;
  --sun: #ffc93c;
  --coral: #ff7a59;
  --mint: #2fbf98;
  --paper: #ffffff;
  --hp1: #ff8a5c;
  --hp2: #f0545c;
  --hp3: #a33b78;
  --veil: rgba(228, 244, 251, 0.5);
  --f-display: "Bungee", "Arial Black", Impact, sans-serif;
  --f-body: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky-low);
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
.bar {
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper);
  border-bottom: 2px solid var(--ink);
}
.brand { font-family: var(--f-display); font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
.modes { display: flex; gap: 4px; flex: 1; justify-content: center; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.modes::-webkit-scrollbar { display: none; }
.modes button { flex: none; }
.modes button, .mute {
  font: 600 14px var(--f-body);
  padding: 7px 9px;
  border-radius: 999px;
  border: 2px solid transparent;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.modes button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.mute { border-color: var(--ink); padding: 5px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.mute[aria-pressed="true"] { text-decoration: line-through; color: var(--ink-soft); border-color: var(--ink-soft); }
button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
@media (max-width: 420px) { .brand { display: none; } .modes { justify-content: flex-start; } }

.stage { position: relative; flex: 1; min-height: 0; touch-action: none; background: var(--sky); overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--veil);
  cursor: pointer;
  touch-action: none;
}
.card {
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--ink);
  padding: 22px 22px 20px;
  max-width: 320px;
  display: flex; flex-direction: column; gap: 10px;
  text-align: center;
}
.eyebrow { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-soft); }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 32px; line-height: 1.05; margin: 0; text-wrap: balance; font-variant-numeric: tabular-nums; }
.card p { margin: 0; line-height: 1.45; font-size: 15px; }
.best { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
.best.new { color: var(--hp2); }
.cta {
  align-self: center; margin-top: 6px;
  font-family: var(--f-display); font-size: 14px;
  background: var(--sun); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 999px;
  padding: 10px 18px;
  animation: bob 1.4s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .cta { animation: none; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">PLUS HAUT</div>
    <nav class="modes" role="tablist" aria-label="Prototypes">
      <button id="tab-flipper" role="tab" data-mode="flipper" aria-selected="true">Flipper</button>
      <button id="tab-flipperplus" role="tab" data-mode="flipperplus" aria-selected="false">Flipper+</button>
      <button id="tab-fronde" role="tab" data-mode="fronde" aria-selected="false">Fronde</button>
      <button id="tab-rebond" role="tab" data-mode="rebond" aria-selected="false">Rebond</button>
      <button id="tab-zigzag" role="tab" data-mode="zigzag" aria-selected="false">Zigzag</button>
    </nav>
    <button id="mute" class="mute" aria-pressed="false">Son</button>
  </header>
  <main class="stage">
    <canvas id="c" aria-label="Zone de jeu"></canvas>
    <div class="overlay" id="ov">
      <div class="card">
        <span class="eyebrow" id="ovEyebrow">Prototype 1 sur 5</span>
        <h2 id="ovTitle">Fronde</h2>
        <p id="ovRule"></p>
        <span class="best" id="ovBest"></span>
        <span class="cta" id="ovCta">Touchez pour jouer</span>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d'), stage = $('.stage'), ov = $('#ov');
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const C = { ink: tok('--ink'), sun: tok('--sun'), coral: tok('--coral'), mint: tok('--mint'), paper: tok('--paper') };
const HP = [null, tok('--hp1'), tok('--hp2'), tok('--hp3')];
const FD = '"Bungee", "Arial Black", sans-serif';
const FB = '"Bricolage Grotesque", "Trebuchet MS", sans-serif';

let W = 360, H = 640;
function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(200, r.width); H = Math.max(300, r.height);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// Repères d'altitude réels, en mètres
const MARKS = [[6, 'Maison à un étage'], [20, 'Immeuble haussmannien'], [35, 'Grand chêne'], [50, 'Arc de Triomphe'], [56, 'Tour de Pise'], [69, 'Tours de Notre-Dame'], [93, 'Statue de la Liberté'], [139, 'Pyramide de Khéops'], [210, 'Tour Montparnasse'],
  [330, 'Tour Eiffel'], [443, 'Empire State Building'], [828, 'Burj Khalifa'], [1000, '1 km'], [4806, 'Mont Blanc'], [8849, 'Everest']];

// ---------- état partagé ----------
const S = { mode: 'fronde', phase: 'menu', g: null, parts: [], floats: [], shake: 0, freeze: 0, deadAt: 0, muted: false, last: 0, keys: {} };
const alt = (g, y) => Math.max(0, (g.startY - y) / g.M);
const bestKey = m => 'plushaut.best.' + (MODES[m].bestKey || m);
function best(m) { try { return +localStorage.getItem(bestKey(m)) || 0; } catch (e) { return 0; } }
function setBest(m, v) { try { localStorage.setItem(bestKey(m), v); } catch (e) {} }
const unitOf = m => MODES[m].unit || 'm';
const scoreOf = g => Math.floor(g.score ?? g.alt);
const fmt = v => v.toLocaleString('fr-FR');

// ---------- son ----------
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function sfx(f, d = 0.08, type = 'square', vol = 0.04, slide = 0) {
  if (S.muted || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}

// ---------- effets ----------
function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * rnd(0.3, 1);
    S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3, life: rnd(0.4, 0.8), max: 0.8, col, r: rnd(2, 4.5) });
  }
}
function float(x, y, text) { S.floats.push({ x, y, text, life: 0.9 }); }
function updFx(dt) {
  for (const p of S.parts) { p.vy += H * 1.6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const f of S.floats) { f.y -= 40 * dt; f.life -= dt; }
  S.floats = S.floats.filter(f => f.life > 0);
}

// ---------- géométrie ----------
function hitRect(b, k) {
  const cx = clamp(b.x, k.x, k.x + k.w), cy = clamp(b.y, k.y, k.y + k.h);
  const dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
  if (d2 > b.r * b.r) return null;
  let nx, ny, d = Math.sqrt(d2);
  if (d > 1e-6) { nx = dx / d; ny = dy / d; }
  else {
    const l = b.x - k.x, r = k.x + k.w - b.x, t = b.y - k.y, bt = k.y + k.h - b.y, m = Math.min(l, r, t, bt);
    if (m === t) { nx = 0; ny = -1; } else if (m === bt) { nx = 0; ny = 1; } else if (m === l) { nx = -1; ny = 0; } else { nx = 1; ny = 0; }
    d = 0;
  }
  const pen = b.r - d; b.x += nx * pen; b.y += ny * pen;
  return { nx, ny };
}
function touches(b, x, y, w, h) {
  const cx = clamp(b.x, x, x + w), cy = clamp(b.y, y, y + h), dx = b.x - cx, dy = b.y - cy;
  return dx * dx + dy * dy < b.r * b.r;
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- décor ----------
const SKY = [[0, '#8fd0ef', '#e4f4fb'], [350, '#7b7fd0', '#ffc09a'], [900, '#1f2560', '#5a4795'], [1800, '#070a22', '#1d2358']];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const SKYRGB = SKY.map(([m, a, b]) => [m, hex(a), hex(b)]);
function skyAt(m) {
  let i = 0; while (i < SKYRGB.length - 2 && m > SKYRGB[i + 1][0]) i++;
  const [m0, a0, b0] = SKYRGB[i], [m1, a1, b1] = SKYRGB[i + 1], t = clamp((m - m0) / (m1 - m0), 0, 1);
  const mix = (p, q) => `rgb(${p.map((v, j) => Math.round(lerp(v, q[j], t))).join(',')})`;
  return [mix(a0, a1), mix(b0, b1)];
}
const STARS = Array.from({ length: 70 }, () => [Math.random(), Math.random(), rnd(0.6, 1.8)]);
function night(g) { return clamp((alt(g, g.camY + H / 2) - 450) / 600, 0, 1); }
function hudCol(g) { return night(g) > 0.45 ? C.paper : C.ink; }

function drawSky(g) {
  const mid = alt(g, g.camY + H / 2);
  const [top, bot] = skyAt(mid + 20);
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, top); gr.addColorStop(1, bot);
  ctx.fillStyle = gr; ctx.fillRect(-30, -30, W + 60, H + 60);
  const n = night(g);
  if (n > 0) {
    ctx.fillStyle = C.paper;
    for (const [sx, sy, sr] of STARS) {
      const y = ((sy * H * 1.5 - g.camY * 0.15) % (H * 1.5) + H * 1.5) % (H * 1.5) - H * 0.25;
      ctx.globalAlpha = n * 0.8; ctx.beginPath(); ctx.arc(sx * W, y, sr, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // graduations tous les 50 m
  const col = hudCol(g);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.font = `600 10px ${FB}`; ctx.textAlign = 'right';
  const T = g.tick || 50, m0 = Math.floor(alt(g, g.camY + H) / T) * T;
  for (let m = m0; m < m0 + H / g.M + 2 * T; m += T) {
    const y = g.startY - m * g.M - g.camY; if (y < -10 || y > H + 10 || m === 0) continue;
    ctx.globalAlpha = 0.4; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W - 10, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillText(m, W - 14, y + 3.5);
  }
  // repères réels
  ctx.textAlign = 'left'; ctx.font = `800 11px ${FB}`;
  for (const [m, label] of MARKS) {
    const y = g.startY - m * g.M - g.camY; if (y < -20 || y > H + 20) continue;
    ctx.globalAlpha = 0.45; ctx.setLineDash([4, 6]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 0.75; ctx.fillText(`${label.toUpperCase()} · ${m} m`, 12, y - 6);
  }
  ctx.globalAlpha = 1;
  if (unitOf(S.mode) === 'm') {
    const b = best(S.mode), y = g.startY - b * g.M - g.camY;
    if (b > 0 && y > -10 && y < H + 10) {
      ctx.fillStyle = C.sun; ctx.fillRect(0, y - 1.5, W, 3);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.strokeRect(0, y - 1.5, W, 3);
      ctx.font = `12px ${FD}`; ctx.textAlign = 'right'; ctx.fillStyle = C.ink;
      const t = `TON RECORD · ${b} m`, tw = ctx.measureText(t).width;
      ctx.fillStyle = C.sun; rr(W - tw - 22, y - 22, tw + 12, 18, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.ink; ctx.fillText(t, W - 16, y - 8.5);
    }
  }
}

function drawFloor(g, k) {
  const y = k.y - g.camY; if (y > H + 10) return;
  ctx.fillStyle = C.ink; ctx.fillRect(-30, y, W + 60, H - y + 40);
  ctx.fillStyle = C.mint; ctx.fillRect(-30, y, W + 60, 5);
  ctx.fillStyle = C.paper; ctx.globalAlpha = 0.7; ctx.font = `800 11px ${FB}`; ctx.textAlign = 'left';
  ctx.fillText('NIVEAU DE LA MER · 0 m', 12, y + 22); ctx.globalAlpha = 1;
}

function drawBrick(g, k) {
  if (k.floor) return drawFloor(g, k);
  let x = k.x; const y0 = k.y - g.camY;
  if (y0 > H + 30 || y0 < -40) return;
  if (k.shake > 0) x += rnd(-2.5, 2.5);
  if (k.crumble > 0.15) x += rnd(-1, 1) * k.crumble * 3;
  const sq = k.squash || 0, h = k.h * (1 - sq * 0.3), y = y0 + k.h * sq * 0.3;
  ctx.fillStyle = C.ink; rr(x, y + 3, k.w, h, 6); ctx.fill();
  ctx.fillStyle = k.spring ? C.mint : HP[Math.min(3, k.hp)]; rr(x, y, k.w, h, 6); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = C.paper; ctx.textAlign = 'center';
  if (k.spring) {
    ctx.strokeStyle = C.paper; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    const cx = x + k.w / 2;
    for (const dx of [-14, 0, 14]) { ctx.beginPath(); ctx.moveTo(cx + dx - 5, y + h / 2 + 3); ctx.lineTo(cx + dx, y + h / 2 - 3); ctx.lineTo(cx + dx + 5, y + h / 2 + 3); ctx.stroke(); }
  } else {
    ctx.font = `12px ${FD}`; ctx.fillText(k.hp, x + k.w / 2, y + h / 2 + 4.5);
  }
}

function drawBall(g, b, glow) {
  const y = b.y - g.camY;
  for (let i = 0; i < g.trail.length; i++) {
    const t = g.trail[i], a = (i + 1) / g.trail.length;
    ctx.globalAlpha = a * 0.35; ctx.fillStyle = C.sun;
    ctx.beginPath(); ctx.arc(t.x, t.y - g.camY, b.r * a, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (glow) {
    ctx.strokeStyle = C.sun; ctx.lineWidth = 3; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(performance.now() / 120);
    ctx.beginPath(); ctx.arc(b.x, y, b.r + 6, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = C.sun; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, y - b.r * 0.35, b.r * 0.28, 0, 7); ctx.fill();
}
function pushTrail(g) { g.trail.push({ x: g.ball.x, y: g.ball.y }); if (g.trail.length > 10) g.trail.shift(); }

function drawHud(g) {
  const col = hudCol(g);
  ctx.fillStyle = col; ctx.textAlign = 'center';
  ctx.font = `30px ${FD}`; ctx.fillText(`${fmt(scoreOf(g))} ${unitOf(S.mode)}`, W / 2, 46);
  const b = best(S.mode);
  if (b) { ctx.font = `800 10px ${FB}`; ctx.globalAlpha = 0.7; ctx.fillText(`RECORD ${fmt(b)} ${unitOf(S.mode)}`, W / 2, 62); ctx.globalAlpha = 1; }
  for (const f of S.floats) {
    ctx.globalAlpha = clamp(f.life * 2, 0, 1); ctx.font = `14px ${FD}`; ctx.fillStyle = col;
    ctx.fillText(f.text, f.x, f.y - g.camY);
  }
  ctx.globalAlpha = 1;
  MODES[S.mode].hud?.(g, col);
}
function drawParts(g) {
  for (const p of S.parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.r, p.y - g.camY - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
}

// =====================================================================
// 1. FRONDE : tir à la fronde, chaque brique cassée recharge un tir
// =====================================================================
const fronde = {
  title: 'Fronde', n: 3,
  rule: 'Glissez vers le bas puis relâchez pour lancer la bille. Le temps ralentit pendant la visée. Chaque brique cassée recharge un tir.',
  init() {
    const g = { camY: 0, startY: H - 60, M: H / 50, bricks: [], charges: 1, maxCharges: 2, aim: null, ts: 1, alt: 0, trail: [], noCharge: 0 };
    g.grav = H * 2.2; g.vmax = Math.sqrt(2 * g.grav * H * 0.8);
    g.ball = { x: W / 2, y: g.startY - 10, vx: 0, vy: 0, r: 10 };
    g.floor = { x: -50, y: g.startY, w: W + 100, h: H, floor: true };
    g.top = g.startY - H * 0.3;
    this.gen(g);
    return g;
  },
  gen(g) {
    while (g.top > g.camY - H * 0.6) {
      const a = alt(g, g.top), n = Math.random() < 0.55 ? 1 : 2;
      const placed = [];
      for (let i = 0; i < n; i++) {
        const w = W * rnd(0.2, 0.3);
        let x, ok = false;
        for (let t = 0; t < 8 && !ok; t++) { x = rnd(8, W - 8 - w); ok = placed.every(p => x + w + 12 < p.x || x > p.x + p.w + 12); }
        if (!ok) continue;
        const hp = 1 + (Math.random() < Math.min(0.6, a / 500) ? 1 : 0) + (Math.random() < Math.min(0.4, a / 1500) ? 1 : 0);
        const k = { x, y: g.top, w, h: 20, hp, spring: Math.random() < 0.1, crumble: 0, shake: 0, squash: 0 };
        placed.push(k); g.bricks.push(k);
      }
      g.top -= H * (0.14 + Math.min(0.12, a / 4000)) * rnd(0.8, 1.2);
    }
    g.bricks = g.bricks.filter(k => !k.dead && k.y < g.camY + H + 60);
  },
  launchVec(g) {
    const a = g.aim, dx = a.sx - a.x, dy = a.sy - a.y, len = Math.hypot(dx, dy);
    if (len < 14) return null;
    const p = Math.min(1, len / (Math.min(W, H) * 0.33));
    return { vx: dx / len * g.vmax * p, vy: dy / len * g.vmax * p, p };
  },
  breakBrick(g, k, recharge) {
    k.dead = true;
    burst(k.x + k.w / 2, k.y + k.h / 2, HP[1], 14, H * 0.6);
    if (recharge) {
      const had = g.charges;
      g.charges = Math.min(g.maxCharges, g.charges + 1);
      if (g.charges > had) float(k.x + k.w / 2, k.y - 8, '+1 TIR');
      S.freeze = 0.045; S.shake = Math.max(S.shake, 0.25);
    }
    sfx(660, 0.12, 'square', 0.04, 1.6);
  },
  update(g, dt) {
    const target = g.aim && g.charges > 0 ? 0.18 : 1;
    g.ts += (target - g.ts) * Math.min(1, dt * 14);

  },
  draw(g) {
    drawBrick(g, g.floor);
    for (const k of g.bricks) if (!k.dead) drawBrick(g, k);
    const b = g.ball;
    if (g.aim && g.charges > 0) {

        ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';

// 4. FLIPPER : des étages de flippers empilés, un seul bouton les lève tous
// =====================================================================
const A_REST = 0.52, A_UP = -0.42;
// Point le plus proche sur un segment, et côté « dessus » (traversable par en dessous)
function segContact(b, x1, y1, x2, y2, rad, oneWay) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  const t = clamp(((b.x - x1) * dx + (b.y - y1) * dy) / l2, 0, 1);
  const cx = x1 + dx * t, cy = y1 + dy * t;
  const ex = b.x - cx, ey = b.y - cy, d = Math.hypot(ex, ey);
  if (d >= b.r + rad || d < 1e-6) return null;
  if (oneWay) {
    let ux = dy, uy = -dx; if (uy > 0) { ux = -ux; uy = -uy; }
    if ((b.x - x1) * ux + (b.y - y1) * uy <= 0) return null;
  }
  return { nx: ex / d, ny: ey / d, pen: b.r + rad - d, cx, cy };
}
function flipEnds(f) {
  const th = f.side > 0 ? f.a : Math.PI - f.a;
  return { x2: f.px + Math.cos(th) * f.L, y2: f.py + Math.sin(th) * f.L, om: f.side > 0 ? f.w : -f.w };
}

const flipper = {

          if (vn < 0) {
            b.vx -= 1.3 * vn * c.nx; b.vy -= 1.3 * vn * c.ny;
            if (-vn > H * 1.2 && om) { sfx(330, 0.08, 'triangle', 0.05, 1.8); S.shake = Math.max(S.shake, 0.15); if (-vn > H * 2) S.freeze = 0.03; }
          }
        }
      }
      for (const p of g.bumpers) {
        const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
        if (d < b.r + p.r && d > 1e-6) {
          const nx = dx / d, ny = dy / d; b.x = p.x + nx * (b.r + p.r); b.y = p.y + ny * (b.r + p.r);
          const sp = Math.max(Math.hypot(b.vx, b.vy) * 0.9, H * 1.15);
          b.vx = nx * sp; b.vy = ny * sp;
          if (p.lit < 0.1) { sfx(880, 0.08, 'square', 0.04, 0.6); burst(p.x + nx * p.r, p.y + ny * p.r, C.sun, 6, H * 0.35); }
          p.lit = 0.18;

      for (const t of g.targets) {
        if (!t.up) continue;

        const vn = b.vx * c.nx + b.vy * c.ny; if (vn < 0) { b.vx -= 1.5 * vn * c.nx; b.vy -= 1.5 * vn * c.ny; }
        t.up = false; t.flash = 0.3; t.grp.left--;

          g.mult = Math.min(5, g.mult + 1);
          float(t.x + t.w / 2 - 34, t.y - 16, `MULTI ×${g.mult}`);
          sfx(660, 0.1, 'square', 0.04); setTimeout(() => sfx(990, 0.18, 'square', 0.04), 90);

        r.used = true;

        float(r.x, r.y - 20, 'TREMPLIN !'); S.shake = 0.4;

    }
    // tombée sous l'étage atteint : le multiplicateur est perdu

    const tgt = b.y - H * 0.4;
    if (tgt < g.camY) g.camY += (tgt - g.camY) * Math.min(1, dt * 5);

        this.launch(g, (s ? s.y : g.camY + H * 0.6) - H * 0.12);

  deathLine(g) { return `${Math.floor(g.alt)} m, étage ${g.maxStage}. ${landmark(Math.floor(g.alt))}`; },
  draw(g) {

      ctx.fillStyle = p.lit ? C.sun : C.mint; ctx.beginPath(); ctx.arc(p.x, y, r, 0, 7); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();

    }

        ctx.fillStyle = HP[3]; rr(k.x, y, k.w, k.h, 3); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
      } else {
        ctx.globalAlpha = 0.35 + k.flash * 2; ctx.strokeStyle = hudCol(g); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(k.x + 3, y + k.h); ctx.lineTo(k.x + k.w - 3, y + k.h); ctx.stroke(); ctx.globalAlpha = 1;
      }

      const y = r.y + oy; if (y < -40 || y > H + 40) continue;
      ctx.globalAlpha = r.used ? 0.3 : 1;
      if (!r.used) { ctx.strokeStyle = C.sun; ctx.lineWidth = 3; ctx.globalAlpha = 0.5 + 0.4 * Math.sin(t * 6); ctx.beginPath(); ctx.arc(r.x, y, r.r + 6 + 2 * Math.sin(t * 6), 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(r.x, y + 3, r.r, 0, 7); ctx.fill();
      ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(r.x, y, r.r, 0, 7); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
      ctx.lineWidth = 3; ctx.lineJoin = 'round';

      ctx.fillStyle = hudCol(g); ctx.font = `800 9px ${FB}`; ctx.textAlign = 'center'; ctx.fillText('+3 ÉTAGES', r.x, y + r.r + 15);
      ctx.globalAlpha = 1;
    }
    for (const p of g.pickups) {
      const y = p.y + oy + Math.sin(t * 3) * 3; if (y < -30 || y > H + 30) continue;
      ctx.fillStyle = C.paper; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(p.x, y, p.r * 0.45, 0, 7); ctx.fill(); ctx.stroke();

    }

        ctx.fillText(`ÉTAGE ${s.i}`, 12, s.guides[0][1] + oy - 10); ctx.globalAlpha = 1;
      }

    drawBall(g, g.ball, g.boost > 0);
  },
  hud(g, col) {
    ctx.fillStyle = col; ctx.textAlign = 'left';
    ctx.font = `800 10px ${FB}`; ctx.globalAlpha = 0.8; ctx.fillText('ÉTAGE', 14, 30); ctx.globalAlpha = 1;
    ctx.font = `18px ${FD}`; ctx.fillText(g.maxStage, 14, 50);
    ctx.font = `800 10px ${FB}`; ctx.globalAlpha = 0.8; ctx.fillText(`${Math.floor(g.alt)} m`, 14, 64); ctx.globalAlpha = 1;
    ctx.textAlign = 'right';
    ctx.font = `800 10px ${FB}`; ctx.globalAlpha = 0.8; ctx.fillText('MULTI', W - 14, 30); ctx.globalAlpha = 1;
    ctx.font = `18px ${FD}`; ctx.fillStyle = g.mult > 1 ? HP[3] : col; ctx.fillText(`×${g.mult}`, W - 14, 50);

      const pulse = 0.55 + 0.35 * Math.sin(performance.now() / 110);
      ctx.globalAlpha = pulse; ctx.fillStyle = C.sun; ctx.fillRect(0, H - 6, W * Math.min(1, g.saver / 10), 6);
      ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.font = `800 10px ${FB}`;

  },
  down(g) { g.hold = true; sfx(180, 0.05, 'square', 0.03); },
  move() {},
  up(g) { g.hold = false; }
};


// =====================================================================
// FLIPPER (épuré) : un geste, un score en mètres, on perd au premier étage raté
// =====================================================================
const FUNNY = ['La gravité gagne toujours.', 'La bille a le vertige.', 'Newton vous salue.', 'Si près du ciel…', 'Le sol vous remercie de votre visite.'];
const flipperPur = Object.assign(Object.create(flipper), {
  title: 'Flipper', n: 1, unit: 'm', bestKey: 'flipper-etages', pure: true,
  rule: 'Gardez le doigt appuyé pour lever les flippers. Montez d\'étage en étage (1 étage = 3 m). Si la bille sort par le bas de l\'écran, c\'est fini.',
  init() {
    const g = { camY: 0, M: H * 0.5 / 3, D: H * 0.5, tick: 15, stages: [], bumpers: [], targets: [], ramps: [], pickups: [], alt: 0, mult: 1, saver: 0,
      boost: 0, trail: [], hold: false, maxStage: 0, idx: 0, sinceRamp: 0, sinceSaver: 0, rampEvery: 6 };
    g.grav = H * 1.9; g.vmax = Math.sqrt(2 * g.grav * H * 1.25);
    g.top = H * 0.8; g.startY = g.top;
    g.ball = { x: W * 0.22, y: g.top - H * 0.1, vx: W * 0.1, vy: 0, r: 9 };
    this.gen(g);
    return g;
  },
  gen(g) {
    while (g.top > g.camY - H * 0.7) {
      const i = this.makeStage(g, g.top);
      const D = g.D, base = g.top; // 1 étage = 3 m, toujours le même écart à l'écran
      g.sinceRamp++;
      const occ = [];
      const place = (r, y0 = 0.35, y1 = 0.8, x0 = 0.14, x1 = 0.86) => {
        for (let t = 0; t < 14; t++) {
          const x = rnd(W * x0, W * x1), y = base - D * rnd(y0, y1);
          if (occ.every(o => Math.hypot(o.x - x, o.y - y) > o.r + r + 30)) { occ.push({ x, y, r }); return { x, y }; }
        }
        return null;
      };
      // les premiers étages n'ont que des flippers ; les éléments arrivent un par un en montant
      if (i >= 6 && g.sinceRamp >= g.rampEvery) {
        const p = place(24, 0.45, 0.75, 0.22, 0.78);
        if (p) { g.ramps.push({ x: p.x, y: p.y, r: 17, used: false }); g.sinceRamp = 0; g.rampEvery = 6 + Math.floor(Math.random() * 4); }
      }
      if (i >= 2) {
        const nb = (Math.random() < 0.7 ? 1 : 0) + (i >= 8 && Math.random() < 0.5 ? 1 : 0);
        for (let k = 0; k < nb; k++) { const r = rnd(13, 18), p = place(r); if (p) g.bumpers.push({ x: p.x, y: p.y, r, lit: 0 }); }
      }

    }

    g.stages = g.stages.filter(s => s.y < lim + 20);
    g.bumpers = g.bumpers.filter(p => p.y < lim);
    g.ramps = g.ramps.filter(r => r.y < lim);
  },
  deathLine(g) { return `Étage ${g.maxStage}. ${landmark(Math.floor(g.alt))} ${pick(FUNNY)}`; },
  hud(g, col) {
    ctx.fillStyle = col; ctx.textAlign = 'left';
    ctx.font = `800 10px ${FB}`; ctx.globalAlpha = 0.8; ctx.fillText('ÉTAGE', 14, 30); ctx.globalAlpha = 1;
    ctx.font = `18px ${FD}`; ctx.fillText(g.maxStage, 14, 50);

});
const pick = a => a[Math.floor(Math.random() * a.length)];

const MODES = { flipper: flipperPur, flipperplus: flipper, fronde, rebond, zigzag };

// ---------- cycle de partie ----------
function die() {
  const g = S.g;
  if (S.phase !== 'play') return;
  S.phase = 'dead'; S.deadAt = performance.now(); S.shake = 0.6;
  burst(g.ball.x, g.ball.y, C.sun, 26, H * 0.9);
  sfx(240, 0.4, 'sawtooth', 0.05, 0.25);
  const sc = scoreOf(g), b = best(S.mode);
  g.newBest = sc > b && sc > 0;
  g.prevBest = b;
  if (g.newBest) setBest(S.mode, sc);

}
function showOverlay() {
  const m = MODES[S.mode], g = S.g;
  const bestEl = $('#ovBest');
  bestEl.classList.remove('new');
  if (S.phase === 'dead') {
    $('#ovEyebrow').textContent = m.title;
    $('#ovTitle').textContent = `${fmt(scoreOf(g))} ${unitOf(S.mode)}`;
    $('#ovRule').textContent = m.deathLine ? m.deathLine(g) : landmark(Math.floor(g.alt));
    if (g.newBest) { bestEl.textContent = 'Nouveau record'; bestEl.classList.add('new'); }
    else bestEl.textContent = `Record : ${fmt(g.prevBest)} ${unitOf(S.mode)}`;
    $('#ovCta').textContent = 'Touchez pour rejouer';
  } else {
    $('#ovEyebrow').textContent = `Prototype ${m.n} sur 5`;
    $('#ovTitle').textContent = m.title;
    $('#ovRule').textContent = m.rule;
    const b = best(S.mode);
    bestEl.textContent = b ? `Record : ${fmt(b)} ${unitOf(S.mode)}` : '';
    bestEl.hidden = !b;
    $('#ovCta').textContent = 'Touchez pour jouer';
  }
  if (S.phase === 'dead') bestEl.hidden = false;
  ov.hidden = false;
}
function landmark(m) {
  let last = null, next = MARKS[0];
  for (const mk of MARKS) { if (mk[0] <= m) last = mk; else { next = mk; break; } }
  if (!last) return `Encore ${next[0] - m} m pour dépasser la ${next[1]}.`;
  if (last === MARKS[MARKS.length - 1]) return 'Plus haut que l\'Everest.';
  return `Plus haut que : ${last[1]}. Prochain repère : ${next[1]} (${next[0]} m).`;
}
function setMode(m) {
  S.mode = m;
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  S.phase = 'menu'; S.parts = []; S.floats = []; S.g = MODES[m].init();
  showOverlay();
}
function startRun() {
  if (S.phase === 'dead') { S.parts = []; S.floats = []; S.g = MODES[S.mode].init(); }
  S.phase = 'play'; ov.hidden = true; S.last = 0;
}

// ---------- entrées ----------
function local(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
let activePointer = null;
ov.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  if (S.phase === 'dead' && performance.now() - S.deadAt < 450) return;
  startRun();
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  if (S.phase !== 'play' || activePointer !== null) return;
  activePointer = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const [x, y] = local(e); MODES[S.mode].down(S.g, x, y);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointer || S.phase !== 'play') return;
  const [x, y] = local(e); MODES[S.mode].move(S.g, x, y);
});
const release = e => {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  if (S.phase === 'play') MODES[S.mode].up(S.g);
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
window.addEventListener('keydown', e => {
  S.keys[e.key] = true;
  if (e.key === ' ' && !e.repeat) {
    e.preventDefault(); ensureAudio();
    if (S.phase !== 'play') { if (S.phase === 'menu' || performance.now() - S.deadAt > 450) startRun(); }
    else if (S.mode === 'zigzag') zigzag.down(S.g);
    else if (S.mode === 'flipper') flipper.down(S.g);
  }
});
window.addEventListener('keyup', e => {
  S.keys[e.key] = false;
  if (e.key === ' ' && S.mode === 'flipper' && S.g) S.g.hold = false;
});
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); saveMode(); b.blur(); }));
const muteBtn = $('#mute');
muteBtn.addEventListener('click', () => {
  S.muted = !S.muted; muteBtn.setAttribute('aria-pressed', S.muted);
  try { localStorage.setItem('plushaut.muted', S.muted ? '1' : ''); } catch (e) {}
  muteBtn.blur();
});
function saveMode() { try { localStorage.setItem('plushaut.mode', S.mode); } catch (e) {} }

// ---------- boucle ----------
function frame(t) {
  const now = t / 1000, dt = S.last ? Math.min(1 / 30, now - S.last) : 1 / 60;
  S.last = now;
  if (S.phase === 'play') { if (S.freeze > 0) S.freeze -= dt; else MODES[S.mode].update(S.g, dt); }
  if (S.phase === 'play' && unitOf(S.mode) === 'm' && !S.g.beat) {
    const b = best(S.mode);
    if (b > 0 && S.g.alt > b) { S.g.beat = true; float(W / 2, S.g.ball.y - 40, 'NOUVEAU RECORD !'); burst(S.g.ball.x, S.g.ball.y, C.sun, 20, H * 0.7); S.shake = Math.max(S.shake, 0.35); sfx(784, 0.12, 'square', 0.05); setTimeout(() => sfx(1175, 0.25, 'square', 0.05), 110); }
  }
  updFx(dt);
  S.shake = Math.max(0, S.shake - dt * 2.2);
  const g = S.g;
  ctx.save();
  if (S.shake > 0) { const s = S.shake * S.shake * 14; ctx.translate(rnd(-s, s), rnd(-s, s)); }
  drawSky(g);
  MODES[S.mode].draw(g);
  drawParts(g);
  ctx.restore();
  drawHud(g);
  requestAnimationFrame(frame);
}

function start(data) {
  resize();
  let m = data && data.mode;
  try { if (!m) m = localStorage.getItem('plushaut.mode'); S.muted = !!localStorage.getItem('plushaut.muted'); } catch (e) {}
  muteBtn.setAttribute('aria-pressed', S.muted);
  setMode(MODES[m] ? m : 'flipper');
  new ResizeObserver(() => { resize(); if (S.phase !== 'play') { S.g = MODES[S.mode].init(); } }).observe(stage);
  window.claude?.hot?.snapshot?.(() => ({ mode: S.mode }));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
